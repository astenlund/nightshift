<title>Recurring Tasks Overnight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header, the night's step rail, the graph stage, then the caption and controls. The stage's sky follows the story (day, dusk, night, morning), so the page commits to that look instead of the viewer's theme. Gates open from the rail into the stage as a widening seam. */
:root {
  --sky: #0c1322;          /* night ground */
  --panel: #131c30;        /* node and card fill */
  --panel-2: #19243c;
  --line: #27324d;
  --ink: #e4e8f3;
  --ink-dim: #8791ab;
  --ink-faint: #525c78;
  --moon: #cdd6ff;         /* attention: current step, active actor, gate */
  --new: #59cf9f;          /* created file; also a passed check */
  --edit: #efb259;         /* edited file */
  --read: #7f8db3;         /* read-only touch */
  --no: #ff8f7d;           /* confirmed finding, failed check, stale evidence */
  --day: #e7edf6;
  --day-ink: #1f2a40;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --ease: cubic-bezier(0.7, 0, 0.3, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 14px/1.5 var(--font-body); }
.app { box-sizing: border-box; height: 100%; min-height: 640px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px; padding-inline: 24px; padding-block: 18px 20px; max-width: 1480px; margin: 0 auto; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
.top h1 { margin: 0; font: 650 22px/1.1 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.project { font: 500 12.5px var(--font-mono); color: var(--ink-dim); padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; }
.tag { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
.clock { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.clock time { font: 500 26px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.clock small { color: var(--ink-dim); font-size: 12px; }

/* Step rail */
.rail { position: relative; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); border-radius: 10px; overflow: hidden; background: linear-gradient(90deg, var(--day) 0%, var(--day) 19.5%, #4a4a72 20.5%, #222c4c 29%, #111a2e 40%, #111a2e 84%, #34385e 89.5%, #f3e6cf 90.5%, var(--day) 100%); }
.step { position: relative; padding: 10px 10px 11px 16px; min-width: 0; color: var(--ink-dim); transition: background 0.5s, color 0.5s, box-shadow 0.5s; }
.step .n { font: 500 11px var(--font-mono); font-variant-numeric: tabular-nums; opacity: 0.8; }
.step .name { display: block; font: 600 12.5px/1.25 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step.day { color: #56627c; }
.step.done { color: #aab3cb; }
.step.day.done { color: var(--day-ink); }
.step.now { color: var(--sky); background: var(--moon); box-shadow: 0 0 24px rgba(205, 214, 255, 0.45); }
.step.later { color: #6f7a98; }
.step.day.later { color: #6b7690; }
/* Gates sit between steps: solid where the runtime refuses to continue, dashed where the gate is your agreement. */
.gate { position: absolute; z-index: 1; top: 7px; bottom: 7px; left: 0; width: 0; border-left: 2px solid rgba(205, 214, 255, 0.55); transition: border-color 0.3s, box-shadow 0.3s; }
.gate.agreement { border-left-style: dashed; border-left-color: rgba(31, 42, 64, 0.55); }
.step.day .gate { border-left-color: rgba(31, 42, 64, 0.5); }
.step.now .gate, .step.now + .step .gate { border-left-color: var(--moon); }
.gate.lit { top: 0; bottom: 0; left: -2px; border-left-width: 4px; border-left-color: var(--moon); box-shadow: 0 0 18px 5px rgba(205, 214, 255, 0.85); }
.gate.lit.no { border-left-color: var(--no); box-shadow: 0 0 14px 2px rgba(255, 143, 125, 0.8); }
.gate.lit.yes { border-left-color: var(--new); box-shadow: 0 0 14px 2px rgba(89, 207, 159, 0.8); }

/* Stage */
.stage { position: relative; min-height: 360px; border: 1px solid var(--line); border-radius: 12px; background: radial-gradient(120% 90% at 20% 0%, #15203a 0%, var(--sky) 60%); overflow: hidden; }
.stage svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; transition: transform 1.1s var(--ease), opacity 1.1s var(--ease), filter 1.1s var(--ease); }
.stage.zoom svg { transform: scale(2.6); opacity: 0.1; filter: blur(2px); }
.stage.swap svg { opacity: 0; transition-duration: 0.25s; }
.legend { position: absolute; top: 12px; right: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--ink-dim); transition: opacity 0.5s; }
.stage.zoom .legend { opacity: 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 12px; border-radius: 3px; border: 1.5px solid; box-sizing: border-box; }
.sw.new { border-color: var(--new); background: rgba(89, 207, 159, 0.12); }
.sw.edit { border-color: var(--edit); background: rgba(239, 178, 89, 0.12); }
.sw.read { border-color: var(--read); border-style: dashed; }
.ln { width: 22px; height: 0; border-top: 2px solid var(--ink-dim); }
.ln.read { border-top: 2px dotted var(--read); }
.ln.handoff { border-top-color: var(--moon); }
.stamp { font: 500 10px var(--font-mono); font-style: normal; padding: 0 6px; border-radius: 8px; border: 1px solid var(--moon); color: var(--moon); }

/* The seam: a gate line that drops from the rail, then widens into the gate's checks. */
.seam { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; box-sizing: border-box; background: var(--moon); box-shadow: 0 0 18px 3px rgba(205, 214, 255, 0.55); clip-path: inset(0 0 100% 0); opacity: 0; overflow: hidden; pointer-events: none;
  transition: clip-path 0.45s var(--ease), opacity 0.3s, left 1.1s var(--ease), width 1.1s var(--ease), top 1.1s var(--ease), bottom 1.1s var(--ease), border-radius 1.1s var(--ease), background 0.6s, box-shadow 0.6s, border-color 0.4s; }
.seam.drop { clip-path: inset(0 0 0 0); opacity: 1; }
.seam.wide { top: max(22px, calc(50% - 240px)); bottom: max(22px, calc(50% - 240px)); border-radius: 14px; background: var(--panel); border: 1px solid var(--moon); box-shadow: 0 0 70px rgba(205, 214, 255, 0.18); pointer-events: auto; }
.seam.no { border-color: var(--no); box-shadow: 0 0 70px rgba(255, 143, 125, 0.16); }
.seam.yes { border-color: var(--new); box-shadow: 0 0 70px rgba(89, 207, 159, 0.16); }
.seam.drop.no:not(.wide) { background: var(--no); box-shadow: 0 0 18px 3px rgba(255, 143, 125, 0.6); }
.seam.drop.yes:not(.wide) { background: var(--new); box-shadow: 0 0 18px 3px rgba(89, 207, 159, 0.6); }
.gate-inner { box-sizing: border-box; height: 100%; width: 100%; min-width: 520px; padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; opacity: 0; transition: opacity 0.35s; overflow: auto; }
.gate-inner.show { opacity: 1; }
.gate-head .kicker { font: 600 10.5px var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--moon); }
.gate-head h3 { margin: 4px 0 2px; font: 650 21px/1.2 var(--font-display); text-wrap: balance; }
.gate-head code { font: 11.5px var(--font-mono); color: var(--ink-faint); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; opacity: 0; transform: translateY(6px); transition: opacity 0.3s, transform 0.3s, background 0.3s; }
.check.in { opacity: 1; transform: none; }
.check .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink-faint); box-sizing: border-box; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.check.pending { background: rgba(205, 214, 255, 0.06); }
.check.pending .dot { border-color: var(--moon); border-top-color: transparent; animation: spin 0.7s linear infinite; }
.check.pass .dot { border-color: var(--new); background: var(--new); color: var(--sky); }
.check.fail { background: rgba(255, 143, 125, 0.1); }
.check.fail .dot { border-color: var(--no); background: var(--no); color: var(--sky); }
.check.skip { opacity: 0.38; }
.check .label { font-size: 14px; color: var(--ink); }
.check .ev { font: 11.5px var(--font-mono); color: var(--ink-dim); text-align: right; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
.check.fail .ev { color: var(--no); }
.check.pass .ev, .check.fail .ev, .check.skip .ev { opacity: 1; }
.verdict { margin-top: auto; opacity: 0; transform: translateY(8px); transition: opacity 0.4s, transform 0.4s; }
.verdict.show { opacity: 1; transform: none; }
.term { margin: 0; padding: 12px 14px; border-radius: 8px; background: #0a101d; border: 1px solid var(--line); font: 12.5px/1.6 var(--font-mono); color: var(--ink-dim); white-space: pre-wrap; }
.term .code { color: var(--no); font-weight: 500; }
.open { display: flex; align-items: baseline; gap: 12px; font: 650 18px var(--font-display); color: var(--new); }
.open small { font: 400 13.5px var(--font-body); color: var(--ink-dim); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Caption and controls */
.caption { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; min-height: 128px; }
.caption .kicker { font: 500 12px var(--font-mono); color: var(--moon); letter-spacing: 0.04em; }
.caption.seamcap .kicker { letter-spacing: 0.12em; }
.caption h2 { margin: 2px 0 6px; font: 650 24px/1.15 var(--font-display); text-wrap: balance; }
.caption p { margin: 0; max-width: 74ch; color: #c3c9da; font-size: 15px; line-height: 1.55; }
.caption p b { color: var(--ink); font-weight: 600; }
.caption .text { transition: opacity 0.3s; }
.caption .text.fade { opacity: 0; }
.controls { display: flex; align-items: center; gap: 8px; }
.controls button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.controls button.play { width: 46px; height: 46px; background: var(--moon); color: var(--sky); border-color: var(--moon); }
.controls button:hover { border-color: var(--moon); }
.controls button:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
.controls .speed { font: 500 12px var(--font-mono); color: var(--ink-dim); }

@media (max-width: 760px) {
  .app { padding-inline: 16px; height: auto; }
  .stage { min-height: 420px; }
  .rail { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .caption { grid-template-columns: 1fr; }
  .clock { margin-left: 0; }
  .gate-inner { min-width: 0; padding: 16px; }
  .check { grid-template-columns: 22px minmax(0, 1fr); }
  .check .ev { grid-column: 2; text-align: left; white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  *, .stage svg, .seam { transition-duration: 0.01ms !important; animation: none !important; }
}
</style>

<div class="app">
  <header class="top">
    <h1>Recurring tasks, overnight</h1>
    <span class="project">tasks · add recurring tasks</span>
    <span class="tag">Illustrative run</span>
    <div class="clock">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 2.5a8 8 0 1 0 4 11.2A6.5 6.5 0 0 1 13.5 2.5z" fill="#cdd6ff"/></svg>
      <time id="clock">03:05</time>
      <small>handed over 22:40</small>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Workflow steps"></nav>

  <div class="stage" id="stage">
    <svg id="graph" viewBox="0 0 1240 600" role="img" aria-label="Actors and files at the current step"></svg>
    <div class="legend">
      <span><i class="sw new"></i>New file</span>
      <span><i class="sw edit"></i>Edited file</span>
      <span><i class="sw read"></i>Read only</span>
      <span><i class="ln read"></i>Reads</span>
      <span><i class="ln"></i>Writes</span>
      <span><i class="ln handoff"></i>Handoff</span>
      <span><i class="stamp">rev 38</i>Review stamp</span>
    </div>
    <div class="seam" id="seam" aria-live="polite"><div class="gate-inner" id="gateInner"></div></div>
  </div>

  <section class="caption" id="caption">
    <div class="text" id="captionText">
      <div class="kicker" id="kicker"></div>

      <button class="play" id="pause" aria-label="Pause"><svg width="16" height="16" viewBox="0 0 16 16" id="pauseIcon"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
      <button id="speed" aria-label="Change speed"><span class="speed" id="speedLabel">1×</span></button>
    </div>
  </section>
</div>

<script>
const STEPS = [
  { name: 'Agree', phase: 'day' },
  { name: 'Spec and review', phase: 'day' },
  { name: 'Handover', phase: 'dusk', gate: 'agreement' },
  { name: 'Implement', phase: 'night', gate: 'runtime' },
  { name: 'Code review', phase: 'night', gate: 'runtime' },
  { name: 'Validate findings', phase: 'night' },
  { name: 'Repair, re-review', phase: 'night', gate: 'runtime' },
  { name: 'Docs', phase: 'night', gate: 'runtime' },
  { name: 'Retrospective', phase: 'night', gate: 'runtime' },
  { name: 'Morning report', phase: 'day', gate: 'runtime' },
];

// Fixed geometry. Files join the graph when first touched.
const POS = {
  user: { x: 92, y: 80, r: 27 }, lead: { x: 304, y: 188, r: 42 }, reviewer: { x: 112, y: 384, r: 34 }, skeptic: { x: 420, y: 384, r: 36 },
  spec: { x: 716, y: 128 }, readme: { x: 716, y: 204 }, quick: { x: 716, y: 280 },
  rec: { x: 924, y: 128 }, cli: { x: 924, y: 204 }, store: { x: 924, y: 280 }, dates: { x: 924, y: 356 },
  rectest: { x: 1132, y: 128 }, clitest: { x: 1132, y: 204 },
};
const FILE_INFO = {
  spec: ['.nightshift/specs/', 'recurring-tasks.md'], readme: ['./', 'README.md'], quick: ['.nightshift/', 'QUICK_WINS.md'],
  rec: ['src/', 'recurrence.js'], cli: ['src/', 'cli.js'], store: ['src/', 'store.js'], dates: ['src/', 'dates.js'],
  rectest: ['test/', 'recurrence.test.js'], clitest: ['test/', 'cli.test.js'],
};
const GROUPS = [{ label: 'Docs and backlog', x: 716 }, { label: 'Source', x: 924 }, { label: 'Tests', x: 1132 }];
const RUN = { x: 612, y: 424, w: 608, h: 140 };

const HISTORY = [
  { from: 'user', to: 'lead', kind: 'handoff', history: true },
  { from: 'readme', to: 'lead', kind: 'read', history: true },
  { from: 'dates', to: 'lead', kind: 'read', history: true },
  { from: 'lead', to: 'spec', kind: 'write', history: true },
  { from: 'lead', to: 'cli', kind: 'write', history: true },
  { from: 'lead', to: 'store', kind: 'write', history: true },
  { from: 'lead', to: 'clitest', kind: 'write', history: true },
  { from: 'lead', to: 'skeptic', kind: 'handoff', history: true },
  { from: 'lead', to: 'run', kind: 'write', history: true },
];
const FINDINGS_DECIDED = [
  { id: 'F1', text: 'Monthly repeat from 31 Jan skips February', where: 'src/recurrence.js:42', status: 'fixed' },
  { id: 'F2', text: 'Completing a task twice spawns two copies', where: 'src/store.js:67', status: 'refuted' },
  { id: 'F3', text: 'No way to stop a series without deleting it', where: 'QUICK_WINS.md', status: 'deferred' },
];
const CHANGED = ['rec', 'cli', 'store', 'rectest', 'clitest'];
const stamps = (rev, stale = []) => Object.fromEntries(CHANGED.map(id => [id, { rev, state: stale.includes(id) ? 'stale' : 'current' }]));
const FILES_TOUCHED = { spec: 'new', readme: 'read', quick: 'edit', rec: 'new', cli: 'edit', store: 'edit', dates: 'read', rectest: 'new', clitest: 'edit' };
const DIFFS = { quick: '+1', cli: '+18 −4', store: '+9 −2', clitest: '+22' };

// Scenes: what the graph shows between gate moments.
const SCENES = {
  fixed: {
    step: 6, clock: '03:05', kicker: 'STEP 07 / 10 · 03:05',
    headline: 'The fix is in and the tests pass',
    body: 'The lead agent fixed F1 and added a test for it, and all 31 tests pass. The fix changed two files the reviewer had already stamped, so those stamps are now stale. <b>The lead agent asks to move on from review.</b>',
    actors: { user: 'asleep', lead: 'active', reviewer: 'done', skeptic: 'done' },
    notes: { lead: 'asks to leave review' },
    files: FILES_TOUCHED, diffs: DIFFS,
    stamps: stamps(38, ['rec', 'rectest']),
    edges: [
      { from: 'lead', to: 'rec', kind: 'write', active: true, label: 'fix F1', labelAt: 0.36 },
      { from: 'lead', to: 'rectest', kind: 'write', active: true, bend: -1 },
      { from: 'lead', to: 'quick', kind: 'write', recent: true },
    ],
    findings: FINDINGS_DECIDED, rev: 44, review: { text: 'Review on record: rev 38 · Codex · Astra', state: 'stale' },
  },
  rereview: {
    step: 6, clock: '03:09', kicker: 'STEP 07 / 10 · 03:09',
    headline: 'A fresh review of the whole change',
    body: 'Refused: the review no longer matches the files. The lead agent sends <b>everything changed since the run began</b>, not just the fix, to a fresh reviewer on the other host.',
    actors: { user: 'asleep', lead: 'idle', reviewer: 'active', skeptic: 'done' },
    notes: { lead: 'waiting for the review', reviewer: 'fresh session' },
    files: FILES_TOUCHED, diffs: DIFFS,
    stamps: Object.fromEntries(CHANGED.map(id => [id, { rev: 38, state: 'reviewing' }])),
    edges: [
      { from: 'lead', to: 'reviewer', kind: 'handoff', active: true, label: 'whole change' },
      { from: 'rec', to: 'reviewer', kind: 'read', active: true },
      { from: 'cli', to: 'reviewer', kind: 'read', active: true },
      { from: 'store', to: 'reviewer', kind: 'read', active: true },
      { from: 'rectest', to: 'reviewer', kind: 'read', active: true },
      { from: 'clitest', to: 'reviewer', kind: 'read', active: true },
    ],
    findings: FINDINGS_DECIDED, rev: 45, review: { text: 'Review on record: rev 38 · Codex · Astra', state: 'stale' },
  },
  reviewed: {
    step: 6, clock: '03:41', kicker: 'STEP 07 / 10 · 03:41',
    headline: 'Every file carries a current stamp again',
    body: 'The new review covers all seven files changed since the run began and raises nothing new. The lead agent records it in the run record and <b>asks again to move on.</b>',
    actors: { user: 'asleep', lead: 'active', reviewer: 'done', skeptic: 'done' },
    notes: { lead: 'asks to leave review', reviewer: 'no new findings' },
    files: FILES_TOUCHED, diffs: DIFFS,
    stamps: stamps(47),
    edges: [
      { from: 'reviewer', to: 'lead', kind: 'handoff', active: true, label: 'review record' },
      { from: 'lead', to: 'run', kind: 'write', active: true },
    ],
    findings: FINDINGS_DECIDED, rev: 47, review: { text: 'Review on record: rev 47 · Codex · Astra', state: 'current' },
  },
  docs: {
    step: 7, clock: '03:43', kicker: 'STEP 08 / 10 · 03:43',
    headline: 'The work moves on to documentation',
    body: 'The gate opened because the evidence held, not because the lead agent said so. Next the lead agent updates the README and moves the feature to the shipped history.',
    actors: { user: 'asleep', lead: 'active', reviewer: 'done', skeptic: 'done' },
    notes: { lead: 'updating the docs' },
    files: { ...FILES_TOUCHED, readme: 'edit' }, diffs: { ...DIFFS, readme: '+6' },
    stamps: stamps(47),
    edges: [{ from: 'lead', to: 'readme', kind: 'write', active: true }],
    findings: FINDINGS_DECIDED, rev: 48, review: { text: 'Review on record: rev 47 · Codex · Astra', state: 'current' },
  },
};

// The review gate, simplified from reviewGateFailure() in internal/runtime/lifecycle.js. It stops at the first failing check.
const REVIEW_GATE = {
  after: 6, kicker: 'Evidence gate · leaving review', claim: 'Claim: the whole change is reviewed', source: 'internal/runtime/lifecycle.js · reviewGateFailure()',
  caption: { kicker: 'SEAM · LEAVING REVIEW', headline: 'The runtime checks the claim', body: 'The lead agent’s word is not evidence. The runtime reads the run record and the files themselves, <b>and stops at the first check that fails.</b>' },
  checks: [
    'The review covers the agreed commitments',
    'A complete review by a strong, independent reviewer',
    'Nothing it reviewed has changed since',
    'Every check passes on the current files',
    'Every finding checked by a skeptic and decided',
    'Accepted fixes were made before this review',
  ],
};
const ATTEMPTS = {
  stale: {
    evidence: ['rev 38 · recurring-tasks.md', 'Codex · Astra · 6/6 dimensions', 'recurrence.js  sha256 9c07e1… → a41f3b…'],
    failAt: 2,
    refusal: '→ move on from review\n← <span class="code">review-required</span>\n  The latest review is stale: files it reviewed have changed.\n  Run a new review of the whole change.',
  },
  pass: {
    evidence: ['rev 47 · recurring-tasks.md', 'Codex · Astra · fresh session', '7 files · every sha256 matches', 'npm test · 31 passed', 'F1 fixed · F2 refuted · F3 deferred', 'F1 fixed at rev 44 · review at rev 47'],
    failAt: -1,
  },
};

const rail = document.getElementById('rail');
const stage = document.getElementById('stage');
const svg = document.getElementById('graph');
const seam = document.getElementById('seam');
const gateInner = document.getElementById('gateInner');
const NS = 'http://www.w3.org/2000/svg';
const W = 178, H = 50;
const C = { moon: '#cdd6ff', dim: '#8791ab', faint: '#525c78', ink: '#e4e8f3', new: '#59cf9f', edit: '#efb259', read: '#7f8db3', no: '#ff8f7d', panel: '#131c30', line: '#27324d' };

function renderRail(current) {
  rail.innerHTML = '';
  STEPS.forEach((s, i) => {
    const node = document.createElement('div');
    const when = i < current ? 'done' : i === current ? 'now' : 'later';
    node.className = `step ${s.phase === 'day' ? 'day' : ''} ${when}`;
    node.innerHTML = `${s.gate ? `<i class="gate ${s.gate}"></i>` : ''}<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="name">${s.name}</span>`;
    rail.appendChild(node);
  });
}

const el = (tag, attrs, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  parent.appendChild(n);
  return n;
};
const text = (str, attrs, parent) => { const t = el('text', attrs, parent); t.textContent = str; return t; };

function port(id, toward) {
  if (id === 'run') return toward.x < RUN.x ? { x: RUN.x - 3, y: RUN.y + 48 } : { x: Math.min(Math.max(toward.x, RUN.x + 40), RUN.x + RUN.w - 40), y: RUN.y - 3 };
  const n = POS[id];
  if (n.r) {
    const a = Math.atan2(toward.y - n.y, toward.x - n.x);
    return { x: n.x + Math.cos(a) * (n.r + 5), y: n.y + Math.sin(a) * (n.r + 5) };
  }
  const dx = toward.x - n.x;
  if (Math.abs(dx) > W / 2) return { x: n.x + Math.sign(dx) * (W / 2 + 3), y: n.y };
  return { x: n.x, y: n.y + Math.sign(toward.y - n.y) * (H / 2 + 3) };
}
const center = id => id === 'run' ? { x: RUN.x + RUN.w / 2, y: RUN.y + RUN.h / 2 } : POS[id];
function curve(a, b, sign = 1) {
  const p = port(a, center(b)), q = port(b, center(a));
  const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
  const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1;
  const bend = sign * Math.min(60, len * 0.14);
  const c = { x: mx - (dy / len) * bend, y: my + (dx / len) * bend };
  return { p, q, c, d: `M${p.x.toFixed(1)} ${p.y.toFixed(1)} Q${c.x.toFixed(1)} ${c.y.toFixed(1)} ${q.x.toFixed(1)} ${q.y.toFixed(1)}` };
}
const at = ({ p, c, q }, t) => ({ x: (1 - t) ** 2 * p.x + 2 * (1 - t) * t * c.x + t * t * q.x, y: (1 - t) ** 2 * p.y + 2 * (1 - t) * t * c.y + t * t * q.y });

function renderGraph(scene) {
  svg.innerHTML = `<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow-moon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="${C.moon}"/></marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 9 5 0 9z" fill="${C.faint}"/></marker></defs>`;
  for (const g of GROUPS) text(g.label.toUpperCase(), { x: g.x - W / 2, y: 78, fill: C.faint, 'font-size': 10.5, 'letter-spacing': '0.1em', 'font-family': 'IBM Plex Sans, sans-serif', 'font-weight': 600 }, svg);

  const shown = new Set(Object.keys(scene.files));
  const edgeLayer = el('g', {}, svg);
  for (const e of [...HISTORY, ...scene.edges]) {
    if (![e.from, e.to].every(id => id === 'run' || POS[id].r || shown.has(id))) continue;
    const g = curve(e.from, e.to, e.bend ?? 1);
    const target = scene.files[e.to];
    let stroke = C.dim;
    if (e.kind === 'handoff') stroke = C.moon;
    if (e.kind === 'read') stroke = C.read;
    if (e.kind === 'write' && target === 'new') stroke = C.new;
    if (e.kind === 'write' && target === 'edit') stroke = C.edit;
    if (e.kind === 'write' && e.to === 'run') stroke = C.moon;
    const opacity = e.history ? 0.14 : e.active ? 0.95 : 0.45;
    el('path', {
      d: g.d, fill: 'none', stroke, 'stroke-width': e.active ? 2 : 1.5, opacity,
      'stroke-dasharray': e.kind === 'read' ? '1.5 5' : 'none', 'stroke-linecap': 'round',
      'marker-end': e.kind === 'handoff' ? (e.history ? 'url(#arrow-dim)' : 'url(#arrow-moon)') : 'none',
    }, edgeLayer);
    if (e.active) {
      // Particles flow from source to target along the edge.
      for (let i = 0; i < 3; i++) {
        const dot = el('circle', { r: 3, fill: stroke, filter: 'url(#glow)' }, edgeLayer);
        el('animateMotion', { dur: '1.8s', repeatCount: 'indefinite', begin: `${-i * 0.6}s`, path: g.d }, dot);
      }
    }
    if (e.label && !e.history) {
      const pt = at(g, e.labelAt ?? 0.5);
      const w = e.label.length * 6.6 + 16;
      const chip = el('g', { transform: `translate(${pt.x - w / 2} ${pt.y - 10})` }, edgeLayer);
      el('rect', { width: w, height: 20, rx: 10, fill: '#19243c', stroke, 'stroke-opacity': 0.6 }, chip);
      text(e.label, { x: w / 2, y: 14, 'text-anchor': 'middle', fill: C.ink, 'font-size': 11, 'font-family': 'IBM Plex Mono, monospace' }, chip);
    }
  }

  for (const [id, state] of Object.entries(scene.files)) {
    const { x, y } = POS[id];
    const [dir, name] = FILE_INFO[id];
    const g = el('g', { transform: `translate(${x - W / 2} ${y - H / 2})` }, svg);
    const border = { new: C.new, edit: C.edit, read: '#3a4666' }[state];
    const fill = { new: 'rgba(89,207,159,0.10)', edit: 'rgba(239,178,89,0.10)', read: C.panel }[state];
    const shape = `M8 0H${W - 12}L${W} 12V${H - 8}Q${W} ${H} ${W - 8} ${H}H8Q0 ${H} 0 ${H - 8}V8Q0 0 8 0Z`;
    el('path', { d: shape, fill: C.panel }, g);
    el('path', { d: shape, fill, stroke: border, 'stroke-width': 1.6, 'stroke-dasharray': state === 'read' ? '3 3' : 'none' }, g);
    el('path', { d: `M${W - 12} 0V12H${W}`, fill: 'none', stroke: border, 'stroke-width': 1.2 }, g);
    text(dir, { x: 12, y: 18, fill: C.dim, 'font-size': 10, 'font-family': 'IBM Plex Mono, monospace' }, g);
    text(name, { x: 12, y: 36, fill: C.ink, 'font-size': 12.5, 'font-family': 'IBM Plex Mono, monospace', 'font-weight': 500 }, g);
    if (state === 'new') {
      el('rect', { x: W - 54, y: 7, width: 36, height: 15, rx: 7.5, fill: C.new }, g);
      text('NEW', { x: W - 36, y: 18, 'text-anchor': 'middle', fill: '#0c1322', 'font-size': 9.5, 'font-weight': 700, 'letter-spacing': '0.08em', 'font-family': 'IBM Plex Sans, sans-serif' }, g);
    } else if (state === 'edit') {
      text(scene.diffs[id] ?? '', { x: W - 18, y: 18, 'text-anchor': 'end', fill: C.edit, 'font-size': 11, 'font-family': 'IBM Plex Mono, monospace' }, g);
    } else {
      text('read', { x: W - 18, y: 18, 'text-anchor': 'end', fill: C.read, 'font-size': 10.5, 'font-family': 'IBM Plex Sans, sans-serif' }, g);
    }
    // Review stamp: pinned to the file's contents at review time.
    const stamp = scene.stamps[id];
    if (stamp) {
      const label = stamp.state === 'stale' ? 'stale' : stamp.state === 'reviewing' ? 'reviewing' : `rev ${stamp.rev}`;
      const color = stamp.state === 'stale' ? C.no : stamp.state === 'reviewing' ? C.dim : C.moon;
      const sw = label.length * 6.4 + 14;
      const s = el('g', { transform: `translate(${W - sw - 8} ${H - 8})` }, g);
      el('rect', { width: sw, height: 16, rx: 8, fill: '#0f1729', stroke: color, 'stroke-dasharray': stamp.state === 'reviewing' ? '2 2' : 'none' }, s);
      text(label, { x: sw / 2, y: 11.5, 'text-anchor': 'middle', fill: color, 'font-size': 10, 'font-family': 'IBM Plex Mono, monospace' }, s);
    }
  }

  const ACTOR_INFO = {
    user: { label: 'You', sub: 'asleep since 22:40' },
    lead: { label: 'Lead', sub: 'Claude Code · Fable', side: 'left' },
    reviewer: { label: 'Reviewer', sub: 'Codex · Astra' },
    skeptic: { label: 'Skeptic', sub: 'Claude Code · Fable' },
  };
  for (const [id, state] of Object.entries(scene.actors)) {
    const a = { ...POS[id], ...ACTOR_INFO[id], note: scene.notes[id] };
    const g = el('g', { transform: `translate(${a.x} ${a.y})` }, svg);
    const active = state === 'active';
    if (active) {
      el('circle', { r: a.r + 12, fill: 'none', stroke: C.moon, 'stroke-width': 1, opacity: 0.35 }, g);
      el('circle', { r: a.r + 4, fill: C.moon, opacity: 0.25, filter: 'url(#glow)' }, g);
    }
    const ring = { active: C.moon, idle: C.dim, done: '#3a4666', asleep: C.line }[state];
    el('circle', { r: a.r, fill: active ? '#1d2946' : C.panel, stroke: ring, 'stroke-width': active ? 2 : 1.5, 'stroke-dasharray': state === 'done' ? '4 4' : 'none' }, g);
    const faded = state === 'asleep' || state === 'done';
    text(a.label, { y: 5, 'text-anchor': 'middle', fill: faded ? '#6c7692' : C.ink, 'font-size': a.r > 38 ? 17 : 13.5, 'font-weight': 650, 'font-family': 'Bricolage Grotesque, sans-serif' }, g);
    const left = a.side === 'left';
    const lx = left ? -a.r - 14 : 0, anchor = left ? 'end' : 'middle';
    text(a.sub, { x: lx, y: left ? -2 : a.r + 19, 'text-anchor': anchor, fill: faded ? C.faint : C.dim, 'font-size': 11, 'font-family': 'IBM Plex Sans, sans-serif' }, g);
    if (a.note) text(a.note, { x: lx, y: left ? 14 : a.r + 34, 'text-anchor': anchor, fill: active ? C.moon : C.faint, 'font-size': 11, 'font-style': 'italic', 'font-family': 'IBM Plex Sans, sans-serif' }, g);
    if (state === 'asleep') text('z z', { x: a.r - 2, y: -a.r + 2, fill: C.faint, 'font-size': 11, 'font-family': 'IBM Plex Sans, sans-serif' }, g);
    if (state === 'done') {
      el('circle', { cx: a.r * 0.72, cy: -a.r * 0.72, r: 8, fill: '#19243c', stroke: '#3a4666' }, g);
      el('path', { d: `M${a.r * 0.72 - 3.5} ${-a.r * 0.72} l2.5 2.5 l4.5 -5`, fill: 'none', stroke: C.dim, 'stroke-width': 1.5 }, g);
    }
  }

  // Run record: the durable state outside any model.
  const g = el('g', { transform: `translate(${RUN.x} ${RUN.y})` }, svg);
  el('rect', { width: RUN.w, height: RUN.h, rx: 10, fill: '#0f1729', stroke: '#3a4666', 'stroke-width': 1.2 }, g);
  el('path', { d: `M0 26H${RUN.w}`, stroke: C.line }, g);
  text('RUN RECORD', { x: 14, y: 17, fill: C.moon, 'font-size': 10.5, 'font-weight': 600, 'letter-spacing': '0.1em', 'font-family': 'IBM Plex Sans, sans-serif' }, g);
  text(`.nightshift/runs/state.sqlite · rev ${scene.rev}`, { x: RUN.w - 14, y: 17, 'text-anchor': 'end', fill: '#6c7692', 'font-size': 10.5, 'font-family': 'IBM Plex Mono, monospace' }, g);
  scene.findings.forEach((f, i) => {
    const y = 46 + i * 24;
    const color = { confirmed: C.no, awaiting: C.moon, fixed: C.new, refuted: C.faint, deferred: '#9fb0e0' }[f.status];
    text(f.id, { x: 14, y, fill: color, 'font-size': 11.5, 'font-weight': 500, 'font-family': 'IBM Plex Mono, monospace' }, g);
    text(f.text, { x: 42, y, fill: f.status === 'refuted' ? '#6c7692' : C.ink, 'font-size': 12, 'font-family': 'IBM Plex Sans, sans-serif' }, g);
    text(f.where, { x: 332, y, fill: '#6c7692', 'font-size': 10.5, 'font-family': 'IBM Plex Mono, monospace' }, g);
    const label = f.status === 'awaiting' ? 'awaiting verdict' : f.status;
    const w = label.length * 6.9 + 18;
    el('rect', { x: RUN.w - 14 - w, y: y - 12, width: w, height: 17, rx: 8.5, fill: f.status === 'refuted' ? 'none' : color, 'fill-opacity': 0.14, stroke: color, 'stroke-opacity': 0.6 }, g);
    text(label, { x: RUN.w - 14 - w / 2, y: y + 0.5, 'text-anchor': 'middle', fill: color, 'font-size': 10.5, 'font-family': 'IBM Plex Sans, sans-serif', 'font-weight': 500 }, g);
  });
  el('path', { d: `M0 ${RUN.h - 30}H${RUN.w}`, stroke: C.line }, g);
  const rc = scene.review.state === 'stale' ? C.no : C.moon;
  el('rect', { x: 14, y: RUN.h - 19, width: 3, height: 10, fill: rc }, g);
  text(scene.review.text, { x: 26, y: RUN.h - 10.5, fill: '#aab3cb', 'font-size': 11.5, 'font-family': 'IBM Plex Sans, sans-serif' }, g);
  text(scene.review.state, { x: RUN.w - 14, y: RUN.h - 10.5, 'text-anchor': 'end', fill: rc, 'font-size': 11.5, 'font-family': 'IBM Plex Mono, monospace' }, g);
}

// Playback: every wait goes through sleep(), which honours pause, speed and restart.
let runId = 0, paused = false, speed = 1;
const sleep = ms => new Promise((resolve, reject) => {
  const id = runId;
  let left = ms / speed, last = performance.now();
  const tick = now => {
    if (id !== runId) return reject(new Error('restarted'));
    if (!paused) left -= now - last;
    last = now;
    left <= 0 ? resolve() : requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
});
const reflow = node => void node.offsetWidth;

function setCaption({ kicker, headline, body }, seamStyle = false) {
  document.getElementById('kicker').textContent = kicker;
  document.getElementById('headline').textContent = headline;
  document.getElementById('body').innerHTML = body;
  document.getElementById('caption').classList.toggle('seamcap', seamStyle);
}
async function showCaption(content, seamStyle) {
  const t = document.getElementById('captionText');
  t.classList.add('fade');
  await sleep(300);
  setCaption(content, seamStyle);
  t.classList.remove('fade');
}
async function showScene(name) {
  const s = SCENES[name];
  stage.classList.add('swap');
  await sleep(250);
  renderRail(s.step);
  renderGraph(s);
  document.getElementById('clock').textContent = s.clock;
  stage.classList.remove('swap');
  await showCaption(s);
}

async function runGate(gate, attempt) {
  const gateEl = rail.children[gate.after + 1].querySelector('.gate');
  const sr = stage.getBoundingClientRect(), gr = gateEl.getBoundingClientRect();
  const x = gr.left - sr.left;
  gateEl.classList.add('lit');
  seam.style.transition = 'none';
  seam.className = 'seam';
  seam.style.left = `${x - 1}px`;
  seam.style.width = '2px';
  gateInner.className = 'gate-inner';
  gateInner.innerHTML = '';
  reflow(seam);
  seam.style.transition = '';
  // 1. The gate line drops from the rail through the stage.
  seam.classList.add('drop');
  await sleep(600);
  // 2. Zoom into the seam while it widens into the gate.
  svg.style.transformOrigin = `${x}px ${sr.height / 2}px`;
  stage.classList.add('zoom');
  const pw = Math.min(660, sr.width - 48);
  seam.style.left = `${(sr.width - pw) / 2}px`;
  seam.style.width = `${pw}px`;
  seam.classList.add('wide');
  showCaption(gate.caption, true);
  await sleep(1100);
  gateInner.innerHTML = `<div class="gate-head"><div class="kicker">${gate.kicker}</div><h3>${gate.claim}</h3><code>${gate.source}</code></div><ol class="checks"></ol><div class="verdict"></div>`;
  const list = gateInner.querySelector('.checks');
  const rows = gate.checks.map(label => {
    const li = document.createElement('li');
    li.className = 'check';
    li.innerHTML = `<span class="dot"></span><span class="label">${label}</span><span class="ev"></span>`;
    list.appendChild(li);
    return li;
  });
  gateInner.classList.add('show');
  await sleep(500);
  // 3. Step through the checks one by one; the first failure ends the walk.
  let failed = false;
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    if (failed) {
      row.classList.add('in', 'skip');
      row.querySelector('.ev').textContent = 'not reached';
      continue;
    }
    row.classList.add('in', 'pending');
    await sleep(750);
    row.classList.remove('pending');
    row.querySelector('.ev').textContent = attempt.evidence[i];
    if (i === attempt.failAt) {
      row.classList.add('fail');
      row.querySelector('.dot').textContent = '✕';
      failed = true;
      seam.classList.add('no');
      gateEl.classList.add('no');
      await sleep(500);
    } else {
      row.classList.add('pass');
      row.querySelector('.dot').textContent = '✓';
      await sleep(320);
    }
  }
  const verdict = gateInner.querySelector('.verdict');
  if (failed) {
    verdict.innerHTML = `<pre class="term">${attempt.refusal}</pre>`;
  } else {
    seam.classList.add('yes');
    gateEl.classList.add('yes');
    verdict.innerHTML = `<div class="open"><span>✓ Gate open</span><small>The work moves on to documentation.</small></div>`;
  }
  verdict.classList.add('show');
  await sleep(failed ? 3600 : 2200);
  // 4. Zoom back out: the gate folds back into a line and the graph fades in.
  gateInner.classList.remove('show');
  await sleep(300);
  seam.classList.remove('wide');
  seam.style.left = `${x - 1}px`;
  seam.style.width = '2px';
  stage.classList.remove('zoom');
  await sleep(1200);
  seam.classList.remove('drop');
  await sleep(450);
  gateEl.classList.remove('lit', 'no', 'yes');
  return !failed;
}

async function play() {
  ++runId;
  paused = false;
  updatePauseIcon();
  stage.classList.remove('zoom', 'swap');
  seam.className = 'seam';
  try {
    await showScene('fixed');
    await sleep(4200);
    await runGate(REVIEW_GATE, ATTEMPTS.stale);
    await showScene('rereview');
    await sleep(4500);
    await showScene('reviewed');
    await sleep(4200);
    await runGate(REVIEW_GATE, ATTEMPTS.pass);
    await showScene('docs');
  } catch (e) {
    if (e.message !== 'restarted') throw e;
  }
}

function updatePauseIcon() {
  document.getElementById('pause').setAttribute('aria-label', paused ? 'Play' : 'Pause');
  document.getElementById('pauseIcon').innerHTML = paused
    ? '<path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/>'
    : '<rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/>';
}
document.getElementById('pause').addEventListener('click', () => { paused = !paused; updatePauseIcon(); });
document.getElementById('restart').addEventListener('click', () => play());
document.getElementById('speed').addEventListener('click', () => {
  speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1;
  document.getElementById('speedLabel').textContent = `${speed}×`;
});

// Render the opening frame at once so the page is complete at rest, then start playback.
renderRail(SCENES.fixed.step);
renderGraph(SCENES.fixed);
setCaption(SCENES.fixed);
play();
</script>
