name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deterministic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/retired-guidance.js
      - run: node skills/ready/ready.test.js
      - run: node skills/init-backlog/unwrap.test.js
      - run: node --test "tests/*.test.js"
      - if: github.event_name != 'workflow_dispatch'
        run: node tools/release-gate.js --baseline ${{ github.event.pull_request.base.sha || github.event.before }}
